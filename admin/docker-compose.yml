version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "sleep 10 && python manage.py runserver 0.0.0.0:8000"
    ports:
      - 8000:8000
    volumes:
      - .:/app:z
    depends_on:
      - db
      - rabbitmq
    environment:
      - PYTHONUNBUFFERED=1

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "sleep 15 && python -u consumer.py"
    depends_on:
      - db
      - rabbitmq
    environment:
      - PYTHONUNBUFFERED=1

  rabbitmq:
    image: rabbitmq:3-management
    container_name: shared-rabbitmq  # Give it a specific name
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  db:
    image: mysql:5.7.22
    restart: always
    environment:
      MYSQL_DATABASE: admin
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - .dbdata:/var/lib/mysql:z
    ports:
      - 33066:3306